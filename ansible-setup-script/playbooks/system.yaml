- name: Installing Regular tools
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tasks:
    - name: Install required packages
      apt:
        name:
          - bash-completion
          - unzip
          - tree
          - snapd
          - light
          - pavucontrol
          - maim
          - xclip
          - fzf
          - picom
          - blueman
          - ripgrep
          - cmake
          - g++
          - pkg-config
          - libfreetype6-dev
          - libfontconfig1-dev
          - libxcb-xfixes0-dev
          - libxkbcommon-dev
          - python3
          - python3.12-venv
        state: present

- name: Installing Rust
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  become_user: "{{ current_user }}"
  tasks:
    - name: Install Rust
      shell: |
        curl https://sh.rustup.rs -sSf | sh -s -- -y
    - name: Setup Rust
      ignore_errors: true
      shell: |
        export PATH="$HOME/.cargo/bin:$PATH"  # Make sure rustup is in PATH
        rustup override set stable
        rustup update stable

- name: Install Alacritty
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  become_user: "{{ current_user }}"
  tasks:
    - name: Download Alacritty Repo
      shell: |
        git clone https://github.com/alacritty/alacritty.git ~/alacritty
    - name: Installing Alacritty using cargo
      shell: |
        export PATH="$HOME/.cargo/bin:$PATH"  # Make sure cargo is in the PATH
        cd ~/alacritty
        cargo build --release
    - name: Setup Themes
      shell: |
        mkdir -p ~/.config/alacritty/themes
        git clone https://github.com/alacritty/alacritty-theme ~/.config/alacritty/themes
    - name: Setup Jet Brains Fonts
      shell: |
        mkdir -p ~/.local/share/fonts
        cd ~/.local/share/fonts
        wget https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
        unzip JetBrainsMono.zip
        rm JetBrainsMono.zip
        fc-cache -fv

- name: Install tmux 
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tasks:
    - name: Installing tmux 
      apt:
        name: tmux
        state: present

- name: Install neovim
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tasks:
    - name: Download and install neovim from GitHub releases
      tags: neovim
      shell: |
        curl -L https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz -o /tmp/nvim.tar.gz
        tar -C /opt -xzf /tmp/nvim.tar.gz
        ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
        rm /tmp/nvim.tar.gz
      args:
        creates: /usr/local/bin/nvim

- name: Install i3 Window Manager 
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tasks:
    - name: Installing i3 
      apt:
        name: i3
        state: present

- name: Install Brave Browser
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tasks:
    - name: Install Brave
      shell: |
        curl -fsS https://dl.brave.com/install.sh | sh

- name: Install ZK 
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tasks:
    - name: Installing ZK
      shell: |
        wget https://github.com/thakurnishu/zk/raw/refs/heads/main/zk
        chmod +x zk
        mv zk /usr/local/bin/zk

- name: Install tree-sitter-cli
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tasks:
    - name: Installing tree-sitter-cli from GitHub
      shell: |
        curl -L https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-cli-linux-x64.zip -o /tmp/tree-sitter.zip
        unzip -o /tmp/tree-sitter.zip -d /usr/local/bin/
        chmod +x /usr/local/bin/tree-sitter
        rm /tmp/tree-sitter.zip
      args:
        creates: /usr/local/bin/tree-sitter

- name: Install Node.js LTS (20.x+)
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tags: nodejs
  tasks:
    - name: Add NodeSource LTS repo and install Node.js
      tags: nodejs
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
        apt install -y nodejs
      args:
        creates: /usr/bin/node

    - name: Set Global npm prefix to current user
      tags: nodejs
      become: yes
      become_user: "{{ current_user }}"
      shell: |
        mkdir -p /home/{{ current_user }}/.npm-global
        npm config set prefix '/home/{{ current_user }}/.npm-global'

    - name: Fix npm directories ownership
      tags: nodejs
      shell: |
        chown -R {{ current_user }}:{{ current_user }} /home/{{ current_user }}/.npm /home/{{ current_user }}/.npm-global 2>/dev/null || true

- name: Install IOS Screen Casting feature # TO RUN 'uxplay -p'
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tasks:
    - name: Installing UXplay
      apt:
        name: uxplay
        state: present
    - name: Installing gstreamer1.0-plugins-bad
      apt:
        name: gstreamer1.0-plugins-bad
        state: present
    - name: Installing gstreamer1.0-libav
      apt:
        name: gstreamer1.0-libav
        state: present

- name: Install AI Coding CLIs
  hosts: localhost
  become: true  # Run tasks with elevated privileges (sudo)
  tags: ai-coding-cli
  become_user: "{{ current_user }}"
  tasks:
    - name: Install Claude code
      tags: ai-coding-cli
      shell: |
        curl -fsSL https://claude.ai/install.sh | bash
    - name: Install Codex
      tags: ai-coding-cli
      shell: |
        npm i -g @openai/codex
    - name: Install OpenCode
      tags: ai-coding-cli
      shell: |
        curl -fsSL https://opencode.ai/install | bash
