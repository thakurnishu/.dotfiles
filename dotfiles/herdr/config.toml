# herdr — agent multiplexer. See `herdr --default-config` for every key and
# its default; only deliberate deviations are listed here.
#
# This file is deployed OUT OF STORE (writable) because herdr rewrites its
# own config -- clearing the onboarding flag, saving settings from prefix+s.

onboarding = false

[theme]
name = "gruvbox"  # matches dotfiles/ghostty/config

[terminal]
# Inherit the source pane's directory, like the `-c "#{pane_current_path}"`
# splits in .tmux.conf.
new_cwd = "follow"

[update]
# Nix owns this binary and flake.lock pins it. The background check only
# nags about versions `herdr update` could never install -- the store path
# is read-only. Bump it with `nix flake update` instead.
version_check = false

[keys]
# herdr's own default. This is also tmux's default prefix, which is fine
# because the two are never nested here: session-picker launches herdr OR
# tmux as the window's command, not one inside the other. If you ever do run
# herdr inside tmux (or vice versa), the inner one becomes unreachable until
# you change one of them.
prefix = "ctrl+b"

# prefix+1..9 already switches tabs, so cycling them with n/p is redundant.
# next_tab is unbound and its key handed to the sessionizer at the bottom of
# this file. The plain built-in "new empty space here" keeps its default
# prefix+shift+n for when you do not want the three-tab layout.
next_tab = ""
new_workspace = "prefix+shift+n"

# prefix+1..9 switches tabs, prefix+shift+1..9 switches spaces. The picker
# (prefix+w) stays for when there are more than nine.
#
# shift rather than alt: herdr's own docs note alt+... reliability depends on
# the terminal, while ctrl+letter, function keys and shift are the dependable
# ones.
#
# NOT "prefix+p+1..9": herdr binds CHORDS, not tmux-style key sequences. The
# grammar is [ctrl/shift/alt/cmd/super +] key, and `p` is not a modifier, so
# there is no way to express "prefix, then p, then a digit".
switch_workspace = "prefix+shift+1..9"

# The built-in new_worktree creates the space but cannot lay out tabs, so it
# is unbound and prefix+shift+g goes to herdr-worktreeizer below.
new_worktree = ""

# prefix+p was the leftover half of the tab-cycling pair that prefix+1..9
# replaced. Unbound rather than repurposed.
previous_tab = ""

[ui]
tab_bar_position = "top"
# Show which agent is in each split without opening the sidebar.
show_agent_labels_on_pane_borders = true

# lazygit is already in packages.nix; popup = session-modal, no layout change.
agent_panel_sort = "spaces"
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"
description = "run lazygit"

# prefix+n: pick a project directory with fzf, then create-or-focus a
# workspace for it laid out as terminal / claude / lazygit. The herdr
# counterpart to tmux-sessionizer, and the same create-or-switch behaviour.
#
# popup, not pane: fzf wants the whole screen for a moment and a popup is
# session-modal, so it does not disturb the layout it is about to build.
[[keys.command]]
key = "prefix+n"
type = "popup"
command = "/Users/nishantsingh/.local/bin/herdr-sessionizer"
width = "90%"
height = "90%"
description = "new project space"

# prefix+shift+g: new branch -> git worktree -> space with terminal + lazygit.
# The branch-level sibling of prefix+n, which works at the repo level.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "/Users/nishantsingh/.local/bin/herdr-worktreeizer"
width = "70%"
height = "70%"
description = "new worktree space"

# prefix+shift+a: reopen the harness picker for this space. The harness tab
# starts one agent and then keeps it forever; this is how you get the menu back
# to pick a different one, and how a worktree space -- laid out without a
# harness tab at all -- gets one.
#
# shift+a rather than a bare letter because herdr's defaults already claim most
# of the alphabet: h/j/k/l are pane movement, and prefix+a is close enough to
# them to be a misfire waiting to happen.
#
# A harness already running is REPLACED in place -- signalled away, and the new
# one started in the same pane. Escaping the picker is how you change nothing.
[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "/Users/nishantsingh/.local/bin/herdr-harness-switch"
width = "70%"
height = "50%"
description = "switch harness"
