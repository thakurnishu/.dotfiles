# starship — faithful reproduction of the bash PROMPT_COMMAND/PS1 from
# .bashrc on the ubuntu-config branch:
#
#   PS1="\[\e[1;32m\]➜  \[\e[38;5;80m\]\W$(parse_python_env)$(parse_git_branch)\[\e[0m\] "
#
#   ➜               bold green (1;32), followed by TWO spaces
#   \W              basename of cwd, colour 80 (38;5;80)
#   🐍 py(env)      "🐍 py(" and ")" bold magenta (1;35), env bold cyan (1;36)
#   git(branch)     "git(" and ")" bold blue (1;34), branch bold red (1;31)
#   ✗               bold yellow (1;33), preceded by a space; shown when the
#                   tree is modified, staged, or has untracked files

format = "$character$directory$python$git_branch${custom.git_dirty} "

add_newline = false

[character]
# The default format is "$symbol " — that trailing space would make three
# spaces after the arrow instead of two.
format = "$symbol"
success_symbol = "[➜  ](bold green)"
error_symbol = "[➜  ](bold green)" # the bash prompt was green unconditionally
vimcmd_symbol = "[❮  ](bold yellow)"

[directory]
# Default format also has a trailing space; drop it so the spacing before
# git( comes only from git_branch's own leading space.
format = "[$path]($style)"
style = "fg:80"
# \W is the basename only, not a truncated path.
truncation_length = 1
truncate_to_repo = false
truncation_symbol = ""

[python]
# parse_python_env — only rendered when a virtualenv is active.
format = " [🐍 py\\(](bold purple)[$virtualenv](bold cyan)[\\)](bold purple)"

[git_branch]
# parse_git_branch — parens blue, branch name red.
format = " [git\\(](bold blue)[$branch](bold red)[\\)](bold blue)"

# starship's git_status emits one symbol per change type, so a tree that is
# both modified and untracked would render "✗✗". The bash function printed a
# single ✗ for "any change", so its exact test is replicated below.
[git_status]
disabled = true

[custom.git_dirty]
description = "single ✗ when the working tree is dirty"
# NOTE: do not set shell = ["sh", "-c"] — starship appends -c itself, so the
# command becomes `sh -c -c '…'` and the module silently never renders.
# The `git rev-parse` guard is essential: outside a repo `git diff --quiet`
# exits 128, so the negation is true and ✗ would render in every directory.
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && { ! git diff --quiet 2>/dev/null || ! git diff --cached --quiet 2>/dev/null || [ -n \"$(git ls-files --others --exclude-standard 2>/dev/null)\" ]; }"
command = "printf '✗'"
format = " [$output](bold yellow)"
