# starship — faithful reproduction of the bash PROMPT_COMMAND/PS1 from
# .bashrc on the ubuntu-config branch:
#
#   PS1="\[\e[1;32m\]➜  \[\e[38;5;80m\]\W$(parse_python_env)$(parse_git_branch)\[\e[0m\] "
#
#   ➜               bold green (1;32), followed by TWO spaces
#   \W              basename of cwd, colour 80 (38;5;80)
#   🐍 py(env)      "🐍 py(" and ")" bold magenta (1;35), env bold cyan (1;36)
#   git(branch)     "git(" and ")" bold blue (1;34), branch bold red (1;31)
#   ✗               bold yellow (1;33), preceded by a space; shown when the
#                   tree is modified, staged, or has untracked files

format = "$character$directory${custom.python_env}$git_branch${custom.git_dirty} "

add_newline = false

# custom.git_dirty below shells out to git three times per prompt. That takes
# ~80ms in fcc-monorepo (4,289 files) -- comfortable against starship's 500ms
# default, until a space first opens and the shell, lazygit, gh-dash and
# `hunk diff --watch` all hit the same repo at once on a cold cache. Then it
# blows the budget, starship kills it, and the prompt warns and drops the ✗.
#
# 2s is far more than the module needs, so this now only trips when something
# is genuinely stuck -- which is the case worth being told about. The cost is
# that this is GLOBAL: any custom command that truly hangs stalls the prompt
# for 2s rather than 0.5s.
command_timeout = 2000

[character]
# The default format is "$symbol " — that trailing space would make three
# spaces after the arrow instead of two.
format = "$symbol"
success_symbol = "[➜  ](bold green)"
error_symbol = "[➜  ](bold green)" # the bash prompt was green unconditionally
vimcmd_symbol = "[❮  ](bold yellow)"

[directory]
# Default format also has a trailing space; drop it so the spacing before
# git( comes only from git_branch's own leading space.
format = "[$path]($style)"
style = "fg:80"
# \W is the basename only, not a truncated path.
truncation_length = 1
truncate_to_repo = false
truncation_symbol = ""

# The built-in python module is NOT used, for two reasons.
#
# It renders whenever python files are DETECTED, not when a virtualenv is
# active -- so in any repo containing .py files it printed an empty "🐍 py()".
# The bash parse_python_env only ever printed for an active venv.
#
# Detecting those files also means READING THE CURRENT DIRECTORY, and that read
# gets `scan_timeout` (30ms by default), not the command_timeout above. In a
# directory with thousands of entries -- /nix/store has 7,013 -- a cold read
# blows it and every prompt prints:
#
#   WARN - (starship::context): Scanning current directory timed out.
#
# It looked intermittent only because a warm page cache makes the second visit
# fast. Raising scan_timeout would just make starship WAIT LONGER there; no
# module in this prompt needs a directory listing at all, so the scan is
# removed instead. $VIRTUAL_ENV is an environment variable, and reading it
# costs nothing.
[python]
disabled = true

[custom.python_env]
description = "🐍 py(venv) — only when a virtualenv is active"
when = 'test -n "$VIRTUAL_ENV"'
command = 'basename "$VIRTUAL_ENV"'
format = " [🐍 py\\(](bold purple)[$output](bold cyan)[\\)](bold purple)"

[git_branch]
# parse_git_branch — parens blue, branch name red.
format = " [git\\(](bold blue)[$branch](bold red)[\\)](bold blue)"

# starship's git_status emits one symbol per change type, so a tree that is
# both modified and untracked would render "✗✗". The bash function printed a
# single ✗ for "any change", so its exact test is replicated below.
[git_status]
disabled = true

[custom.git_dirty]
description = "single ✗ when the working tree is dirty"
# NOTE: do not set shell = ["sh", "-c"] — starship appends -c itself, so the
# command becomes `sh -c -c '…'` and the module silently never renders.
#
# ONE git process, not four. This used to run `rev-parse`, then `diff`, then
# `diff --cached`, then `ls-files --others` -- 73ms in fcc-monorepo, on every
# prompt, in every pane. `git status --porcelain` reports all three kinds of
# change in a single pass: 36ms for the same answer.
#
# The `rev-parse` guard is gone and is genuinely not needed here, though it WAS
# needed for the old test. Outside a repo `git diff --quiet` exits 128, so the
# negation was true and ✗ rendered everywhere; `git status` outside a repo
# writes its error to stderr and prints NOTHING on stdout, so -n is false and
# the module stays silent.
#
# Verified equal to the old test across clean, unstaged, staged, untracked,
# ignored-only, and outside-a-repo.
when = 'test -n "$(git status --porcelain 2>/dev/null)"'
command = "printf '✗'"
format = " [$output](bold yellow)"
