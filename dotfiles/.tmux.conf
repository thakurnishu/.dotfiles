# ---------------------------------------------------------------------------
# STRIPPED TO VANILLA -- every setting below is commented out on purpose.
#
# herdr (see modules/darwin/packages.nix) is being trialled as the multiplexer
# for agent work. Muscle memory from a customised tmux makes that trial
# useless: you cannot tell whether you like herdr's model or just miss your
# own bindings. So tmux is deliberately back to stock -- ctrl+b, no mouse, no
# vi copy mode, default status bar.
#
# Nothing was deleted. To restore, uncomment; the original grouping and
# comments are intact below.
#
# KNOWN CONSEQUENCE: the two terminal lines at the bottom are what neovim's
# :checkhealth asks for. With them commented, truecolor degrades inside tmux
# -- nvim will look washed out. That is expected, not a bug. Uncomment just
# those two if it becomes annoying before the trial is over.
#
# NOTE: re-sourcing this file does NOT undo settings already applied to a
# running server -- tmux has no "unset" on re-source. Run `tmux kill-server`
# (kills every session) or start a fresh session to actually get vanilla.
# ---------------------------------------------------------------------------

# set-option -g history-limit 25000
# set -g mouse on

# for neovim
# set -sg escape-time 10
# set-option -g focus-events on

# set -g extended-keys on

# vi for copy mode
# setw -g mode-keys vi

# macOS clipboard. Not in the Linux config — there, yanking only reached
# tmux's own buffer. copy-pipe-and-cancel sends it to pbcopy so it's
# pasteable in any app.
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
# bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
# bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'

# status bar
# set -g status-right "#(pomo)"
# set -g status-style "fg=#665c54"
# set -g status-left-style "fg=#928374"

# set -g status-bg default
# set -g status-position top
# set -g status-interval 1
# set -g status-left ""

# rename panes to current working directory
# set-option -g automatic-rename on
# set-option -g automatic-rename-format '#{b:pane_current_path}'

# Make new panes start in the same directory as the current pane
# bind '"' split-window -v -c "#{pane_current_path}"
# bind % split-window -h -c "#{pane_current_path}"


# disable status
# set -g status off
# set -g status on

# count the panes from 1
# set -g base-index 1
# setw -g pane-base-index 1

# reload configuration
# NOTE: ~/.tmux.conf is a home-manager symlink into the Nix store, so this
# reloads whatever the last `darwin-rebuild switch` deployed. To change the
# config, edit ~/.dotfiles/dotfiles/.tmux.conf and rebuild.
# bind-key -r r source-file ~/.tmux.conf

# term colors, these are the correct ones according to neovim checkhealth
# set -g default-terminal "tmux-256color"
# set-option -sa terminal-overrides ',xterm-256color:RGB'
